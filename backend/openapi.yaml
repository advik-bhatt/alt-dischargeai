openapi: 3.0.3
info:
  title: DischargeAI backend
  version: 0.2.0
  description: |
    Discharge summaries in (pasted text, a PDF, or dictated audio), a plain-language patient link out,
    every piece of data self-destructs 30 days after it was created.

    Surface: the API note first, the team architecture diagram where the note is silent.
    Provider endpoints need the `x-provider-key` header. Patient endpoints are authenticated by the
    unguessable 128-bit link id (22 base64url characters) and need no header.

    Languages: any BCP-47 code or English language name the model supports is accepted wherever a
    `language` is taken; tested offline with fixtures: en, es (Spanish), zh (Mandarin), ar (Arabic).
    Names recognised: English, Spanish, Mandarin/Chinese, Arabic, Portuguese, French, Haitian Creole,
    Russian, Korean, Vietnamese, Tagalog/Filipino, Hindi, Gujarati, Polish, Italian, German, Japanese,
    Urdu, Bengali, Persian/Farsi. Medication names and doses are never translated.
servers:
  - url: http://localhost:4000
tags:
  - name: provider
    description: Provider front end (x-provider-key).
  - name: patient
    description: Patient link (no header; the link id is the credential).
components:
  securitySchemes:
    providerKey:
      type: apiKey
      in: header
      name: x-provider-key
  parameters:
    sumIdHyphen:
      name: sum-id
      in: query
      description: "The sumId from POST /ingest (22 characters). The tasks doc's spelling; sum_id is accepted too"
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" }
    sumIdUnderscore:
      name: sum_id
      in: query
      description: The same id, as GET /translation spells it
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" }
    link:
      name: link
      in: query
      required: true
      description: The 22-character link id from the patient's email.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" }
    language:
      name: language
      in: query
      required: false
      description: BCP-47 code or English language name (e.g. es, Spanish, zh, ar). Defaults to English, the stored LLM response.
      schema: { type: string }
  schemas:
    Error:
      type: object
      description: "Every error carries the tasks doc's statusCode and message, plus a stable code in error."
      required: [statusCode, message, error]
      properties:
        statusCode: { type: integer, example: 400 }
        message: { type: string, example: type must be text or pdf }
        error: { type: string, description: Stable machine-readable code }
    Patient:
      type: object
      description: "The team contract's patient shape (backend tasks doc, GET /patients), exactly these nine keys, read from the team's patients table (patientinfo). Values are as the table holds them; a key whose column the table lacks is null."
      required: [ID, DOB, FirstName, LastName, ZipCode, email, phoneNumber, caregiverEmail, caregiverName]
      additionalProperties: false
      properties:
        ID: { oneOf: [{ type: string }, { type: integer }], description: "The table's id as stored: a number when the column is INT" }
        DOB: { type: string, format: date, nullable: true, example: "1954-03-18" }
        FirstName: { type: string, nullable: true }
        LastName: { type: string, nullable: true }
        ZipCode: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        phoneNumber: { type: string, nullable: true }
        caregiverEmail: { type: string, format: email, nullable: true }
        caregiverName: { type: string, nullable: true }
    PatientDetail:
      description: "GET /patients/{id}: the nine contract keys plus the preferred language and the active link."
      allOf:
        - $ref: "#/components/schemas/Patient"
        - type: object
          properties:
            preferredLanguage: { type: string, nullable: true, description: BCP-47; the default language for POST /ingest }
            activeLink:
              type: object
              nullable: true
              properties:
                sumId: { type: string }
                link: { type: string }
                status: { type: string }
                createdAt: { type: string, format: date-time }
                expiresAt: { type: string, format: date-time }
                languages: { type: array, items: { type: string } }
    Step:
      type: object
      required: [id, text]
      additionalProperties: false
      properties:
        id: { type: string, description: Stable short id, e.g. step-1 }
        text: { type: string, description: One thing the patient does, at a 5th-grade reading level }
    Medication:
      type: object
      required: [name, dose, howOften, status, why]
      additionalProperties: false
      properties:
        name: { type: string, description: Verbatim from the source, never translated }
        dose: { type: string, description: Verbatim from the source; empty when the source gives none }
        howOften: { type: string, description: In plain words; every number copied from the source }
        status: { type: string, enum: [new, continue, stop] }
        why: { type: string }
    FollowUp:
      type: object
      required: [who, when, why]
      additionalProperties: false
      properties:
        who: { type: string }
        when: { type: string }
        why: { type: string }
    Warning:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string }
        tier: { type: string, enum: [call911, er, clinic], description: call911 = life-threatening, er = same-day care, clinic = call the care team }
    AiOutput:
      description: The fixed JSON the AI pipeline returns per language (contracts/ai-output.schema.json). Exactly these five keys.
      type: object
      required: [language, steps, medications, followUps, warnings]
      additionalProperties: false
      properties:
        language: { type: string, description: BCP-47 code of the text }
        steps: { type: array, items: { $ref: "#/components/schemas/Step" } }
        medications: { type: array, items: { $ref: "#/components/schemas/Medication" } }
        followUps: { type: array, items: { $ref: "#/components/schemas/FollowUp" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/Warning" } }
    LlmSummaryView:
      type: object
      required: ["sum-id", "llm-summary", expiresAt, daysLeft, availableLanguages]
      properties:
        "sum-id": { type: string }
        sumId: { type: string, description: The same value as sum-id }
        patientID: { type: string }
        language: { type: string, enum: [en] }
        status: { type: string }
        "llm-summary": { $ref: "#/components/schemas/AiOutput" }
        availableLanguages: { type: array, items: { type: string }, description: English first, then the translations held on the item }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        daysLeft: { type: integer }
    TranslationView:
      type: object
      required: ["sum-id", lang, fromCache, translation, availableLanguages, expiresAt, daysLeft]
      properties:
        "sum-id": { type: string }
        sumId: { type: string, description: The same value as sum-id }
        lang: { type: string, description: The resolved BCP-47 code }
        fromCache: { type: boolean, description: true when the item already held it; false when the agent ran on this request }
        translation: { $ref: "#/components/schemas/AiOutput" }
        availableLanguages: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
        daysLeft: { type: integer }
    PatientView:
      description: What GET /summary, GET /p/{token} and GET /translate return. The fixed JSON plus the expiry facts.
      allOf:
        - $ref: "#/components/schemas/AiOutput"
        - type: object
          required: [expiresAt, daysLeft, availableLanguages, fromCache]
          properties:
            expiresAt: { type: string, format: date-time, description: createdAt + 30 days exactly; the data is gone after this moment }
            daysLeft: { type: integer }
            availableLanguages: { type: array, items: { type: string }, description: Languages the document store currently holds for this link, English first }
            fromCache: { type: boolean, description: true when served from the document store, false when the translation agent just ran }
    Accepted:
      type: object
      required: [statusCode, message, sumId, link, jobId, expiresAt]
      properties:
        statusCode: { type: integer, enum: [202] }
        message: { type: string, enum: ["ingestion started"] }
        sumId: { type: string, description: "The random path (22 characters, 128 random bits): the activeLinks.sumId, the DynamoDB uid and sum-id, the sum-id / sum_id query value" }
        link: { type: string, description: "${PATIENT_APP_URL}/s/${sumId}" }
        jobId: { type: string }
        expiresAt: { type: string, format: date-time }
        language: { type: string, description: The provider-picked language (BCP-47) produced alongside English }
        statusUrl: { type: string, description: "/jobs/{jobId}" }
        stage: { type: string }
        linkId: { type: string, description: The same value as sumId (earlier name) }
        status: { type: string, enum: ["ingestion started"], description: The same value as message (earlier name) }
    SafetyResult:
      description: Deterministic check that every medication, dose and frequency in the source appears in the output and nothing was invented. Counts and names only; never patient data.
      type: object
      properties:
        passed: { type: boolean }
        checkedAt: { type: string, format: date-time }
        method: { type: string, enum: [deterministic] }
        sourceMedicationCount: { type: integer }
        outputMedicationCount: { type: integer }
        verified: { type: array, items: { type: object, additionalProperties: true } }
        dropped: { type: array, items: { type: object, additionalProperties: true } }
        unsupported: { type: array, items: { type: object, additionalProperties: true } }
        readabilityGrade: { type: number }
        reason: { type: string, description: Present when passed is false, e.g. "safety_check_failed dropped=1 unsupported=0" }
        translations:
          type: array
          items:
            type: object
            properties:
              language: { type: string }
              passed: { type: boolean }
              issues: { type: array, items: { type: string } }
    Job:
      type: object
      properties:
        jobId: { type: string }
        stage: { type: string, enum: [received, extracting, transcribing, simplifying, stored, emailing, done, needs_review, failed] }
        inputKind: { type: string, enum: [text, pdf, audio] }
        error: { type: string, nullable: true }
        safety: { nullable: true, allOf: [{ $ref: "#/components/schemas/SafetyResult" }] }
        verified: { type: boolean, nullable: true }
        languages: { type: array, items: { type: string }, description: Languages stored for the link }
        meta: { type: object, additionalProperties: true, description: provider, model, usage, llmMs, fixture, sourceChars, skipped, pdfPages, speechProvider }
        linkIdHash: { type: string }
        linkRef: { type: string, description: First 8 characters of the link hash, for logs }
        linkStatus: { type: string, nullable: true, enum: [pending, ready, needs_review, failed, expired, purged] }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SynthesizeRequest:
      type: object
      description: Exactly one of linkId or text.
      properties:
        linkId: { type: string, description: Re-run the pipeline over the raw text stored for this link and store the result }
        text: { type: string, description: Run the pipeline over this text and return the JSON without storing it }
        language: { type: string, description: Primary target language (BCP-47 or name); English is always produced }
        languages: { type: array, items: { type: string }, description: Extra target languages }
    SynthesizeResponse:
      type: object
      properties:
        stored: { type: boolean }
        status: { type: string, enum: [ready, needs_review] }
        verified: { type: boolean }
        emailed: { type: boolean, description: linkId mode only; whether the patient has been sent the link }
        languages: { type: array, items: { type: string } }
        perLanguage:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AiOutput" }
        safety: { $ref: "#/components/schemas/SafetyResult" }
        meta: { type: object, additionalProperties: true }
        linkRef: { type: string }
        expiresAt: { type: string, format: date-time }
    Health:
      type: object
      properties:
        ok: { type: boolean }
        service: { type: string }
        clock:
          type: object
          properties:
            now: { type: string, format: date-time }
            offsetDays: { type: number }
            demoNow: { type: string, nullable: true, description: Set when DEMO_NOW pinned the clock }
        linkTtlDays: { type: integer, enum: [30] }
        config:
          type: object
          description: Where the configuration came from. Names only, never values.
          properties:
            source: { type: string, enum: [secrets-manager, env, none] }
            secretArn: { type: string, nullable: true }
            fromSecret: { type: array, items: { type: string } }
            overriddenByEnv: { type: array, items: { type: string } }
            missingKeys: { type: array, items: { type: string } }
            reason: { type: string, nullable: true }
        providers:
          type: object
          properties:
            llm: { type: string, enum: [offline, bedrock, anthropic] }
            llmModel: { type: string }
            speech: { type: string, enum: [offline, transcribe] }
            sql: { type: string, enum: [sqlite, mysql] }
            sqlConnection: { type: string }
            docStore: { type: string, enum: [local, dynamo] }
            docStoreTarget: { type: string }
            audio:
              type: object
              properties:
                store: { type: string, enum: [local, s3] }
                requested: { type: string, enum: [local, s3] }
                bucket: { type: string }
                target: { type: string }
                fallbackReason: { type: string, nullable: true, description: Set when S3 was requested but the bucket was unreachable at boot }
            receipts: { type: string, enum: [sql, file, console, dynamo] }
            email: { type: string, enum: [console, smtp, ses] }
            emailQueue: { type: string, enum: [none, sqs] }
        queue:
          type: object
          properties:
            pending: { type: integer }
paths:
  /health:
    get:
      summary: Liveness, clock, configuration source and active providers
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /patients:
    get:
      tags: [provider]
      security: [{ providerKey: [] }]
      summary: "Task 1 of the backend tasks doc: the patient list from the SQL patients table, with ID, DOB, FirstName, LastName, ZipCode, email, phoneNumber, caregiverEmail, caregiverName"
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive substring over first name, last name, email, phone
      responses:
        "200":
          description: Patients
          content:
            application/json:
              schema:
                type: object
                required: [patients]
                properties:
                  patients: { type: array, items: { $ref: "#/components/schemas/Patient" } }
        "401": { description: Missing or wrong x-provider-key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /patients/{id}:
    get:
      tags: [provider]
      security: [{ providerKey: [] }]
      summary: One patient, with the active link once generated
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Patient, content: { application/json: { schema: { $ref: "#/components/schemas/PatientDetail" } } } }
        "404": { description: patient_not_found }
  /ingest:
    post:
      tags: [provider]
      security: [{ providerKey: [] }]
      summary: "Task 3 of the backend tasks doc: ingest a discharge summary for a patient; 202 before any AI call runs"
      description: |
        JSON body { data, type, patientID } (the tasks doc). type "text": data is the discharge summary text.
        type "pdf": data is the PDF as base64 (a data:application/pdf;base64, prefix is accepted); the PDF is
        stored in S3 emrpdf-rh as <sumId>.pdf and converted with pdfToText. Any other type answers
        400 { statusCode: 400, message: "type must be text or pdf" }.
        The random path (sumId) is stored in the SQL activeLinks table and is the DynamoDB uid of the summary
        item; raw-text is saved on it. The response comes at once; then, asynchronously: the LLM call (plain
        language at a 5th-grade level), deterministic safety checks, the provider-picked translation,
        llm-summary + sum-id saved on the same item with expiresAt = now + 30 days, and the link emailed to the
        patient's email and to caregiverEmail. A summary that fails the safety checks is held as needs_review
        (423 for the patient, no email) until POST /synthesize re-runs it.
        The earlier multipart form (patientId + one of text, file, audio) is kept as an alias; audio comes from
        the architecture diagram and goes to S3 emraudio-rh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, type, patientID]
              properties:
                data: { type: string, description: "The text (type text) or the PDF as base64 (type pdf)" }
                type: { type: string, enum: [text, pdf] }
                patientID: { oneOf: [{ type: string }, { type: integer }], description: "The patient's ID from GET /patients (text or number)" }
                language: { type: string, description: "Optional provider-picked language (BCP-47 or a name such as Spanish). Default: the patient's preferred language, then English" }
            examples:
              text:
                value: { type: text, patientID: pt-0001, language: es, data: "New medications:\n- Furosemide 40 mg by mouth once daily for swelling" }
          multipart/form-data:
            schema:
              type: object
              required: [patientId]
              properties:
                patientId: { type: string }
                text: { type: string, description: Pasted EMR text }
                file: { type: string, format: binary, description: PDF }
                audio: { type: string, format: binary, description: "Dictation (wav, mp3, m4a, webm, ogg, flac); stored in the audio bucket as <sumId>.<ext>" }
                language: { type: string, description: Provider-picked language (BCP-47 or name). Default is the patient's preferred language, then English }
      responses:
        "202": { description: ingestion started, content: { application/json: { schema: { $ref: "#/components/schemas/Accepted" } } } }
        "400": { description: "type must be text or pdf, missing patientID or data, empty_input, multiple_inputs, invalid_language, or validation error", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Missing or wrong x-provider-key }
        "404": { description: patient_not_found }
        "413": { description: file_too_large }
  /jobs/{jobId}:
    get:
      tags: [provider]
      security: [{ providerKey: [] }]
      summary: Follow the 202 (stage, safety-check result, run metadata; no patient text)
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Job, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { description: job_not_found }
  /synthesize:
    post:
      tags: [provider]
      security: [{ providerKey: [] }]
      summary: Run the AI pipeline (simplify, safety checks, translate) and get the fixed JSON per language
      description: |
        `{ text, language?, languages? }` returns the JSON per language without storing anything.
        `{ linkId, language?, languages? }` re-runs the pipeline over the raw text stored for the link
        (after a prompt change, or to release a needs_review summary), replaces the stored LLM response
        and translations, drops stale on-demand translations, and emails the patient once it verifies.
        Safety-check results come back under `safety`, never inside the per-language JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SynthesizeRequest" }
      responses:
        "200": { description: Result, content: { application/json: { schema: { $ref: "#/components/schemas/SynthesizeResponse" } } } }
        "400": { description: "empty_input, invalid_link, invalid_language" }
        "404": { description: link_not_found }
        "409": { description: "job_in_progress (the ingest job has not finished) or no_source_text" }
        "410": { description: link_expired or link_purged }
  /llm-sumary:
    get:
      tags: [patient]
      summary: "Task 4 of the backend tasks doc (spelled so): the llm-summary from the DynamoDB item for a summary id"
      parameters:
        - $ref: "#/components/parameters/sumIdHyphen"
        - $ref: "#/components/parameters/sumIdUnderscore"
      responses:
        "200": { description: The item's llm-summary, content: { application/json: { schema: { $ref: "#/components/schemas/LlmSummaryView" } } } }
        "400": { description: "missing_sum_id or invalid_link", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: link_not_found }
        "410": { description: link_expired (checked at read time, before any purge) or link_purged }
        "423": { description: needs_review }
        "425": { description: "processing; body carries { stage, jobId }" }
  /llm-summary:
    get:
      tags: [patient]
      summary: The same handler as /llm-sumary, correctly spelled
      parameters:
        - $ref: "#/components/parameters/sumIdHyphen"
        - $ref: "#/components/parameters/sumIdUnderscore"
      responses:
        "200": { description: The item's llm-summary, content: { application/json: { schema: { $ref: "#/components/schemas/LlmSummaryView" } } } }
        "400": { description: "missing_sum_id or invalid_link" }
        "404": { description: link_not_found }
        "410": { description: link_expired or link_purged }
        "423": { description: needs_review }
        "425": { description: processing }
  /translation:
    get:
      tags: [patient]
      summary: "Task 5 of the backend tasks doc: the summary in another language, cache-first on the DynamoDB item"
      description: |
        1. Checks the item's translations map for the language (or its base language, es-MX -> es) and returns it (fromCache true).
        2. Otherwise reads the llm-summary (the same path as GET /llm-sumary), sends it to the translation agent with the
           language, waits, checks that every medication name, dose and number came through unchanged, saves the result
           under translations[lang] on the same item, and returns it (fromCache false). A translation that fails the
           check answers 422 and is not saved. lang=en returns the llm-summary.
      parameters:
        - name: lang
          in: query
          required: true
          schema: { type: string }
          description: BCP-47 code or language name, e.g. es, Spanish, zh, Mandarin, ar
        - $ref: "#/components/parameters/sumIdUnderscore"
      responses:
        "200": { description: The translation, content: { application/json: { schema: { $ref: "#/components/schemas/TranslationView" } } } }
        "400": { description: "missing_language, invalid_language, missing_sum_id or invalid_link", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: link_not_found }
        "410": { description: link_expired (checked at read time, before any purge) or link_purged }
        "422": { description: translation_rejected (a name, dose or number changed; nothing saved) }
        "423": { description: needs_review }
        "425": { description: processing }
        "502": { description: translation_failed (the translation agent is unavailable; the English summary is still available) }
  /summary:
    get:
      tags: [patient]
      summary: "Earlier spelling of task 4 (?link=), with an optional language; returns the per-language JSON at the top level"
      parameters:
        - $ref: "#/components/parameters/link"
        - $ref: "#/components/parameters/language"
      responses:
        "200": { description: The fixed JSON plus expiry facts, content: { application/json: { schema: { $ref: "#/components/schemas/PatientView" } } } }
        "400": { description: invalid_link or invalid_language }
        "404": { description: link_not_found }
        "410": { description: link_expired (30 days passed) or link_purged (data deleted) }
        "422": { description: translation_rejected (the translation changed a name, dose or number; the English summary is still available) }
        "423": { description: needs_review (the safety checks failed; the care team must re-run or correct it) }
        "425": { description: "processing; body carries { stage, jobId }" }
        "502": { description: translation_failed (the translation agent is unavailable; the English summary is still available) }
  /translate:
    get:
      tags: [patient]
      summary: "Earlier spelling of task 5 (?link=&language=), same cache-first handler; returns the per-language JSON at the top level"
      parameters:
        - $ref: "#/components/parameters/link"
        - name: language
          in: query
          required: true
          schema: { type: string }
          description: BCP-47 code or English language name, e.g. Spanish, es, zh, ar
      responses:
        "200": { description: Translation, content: { application/json: { schema: { $ref: "#/components/schemas/PatientView" } } } }
        "400": { description: missing_language, invalid_language or invalid_link }
        "404": { description: link_not_found }
        "410": { description: link_expired or link_purged }
        "422": { description: translation_rejected }
        "423": { description: needs_review }
        "425": { description: processing }
        "502": { description: translation_failed }
  /p/{token}:
    get:
      tags: [patient]
      summary: The patient's link with the token in the path (same handler as GET /summary; ?language= follows the cache-first rule)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" }, description: The 22-character link id }
        - $ref: "#/components/parameters/language"
      responses:
        "200": { description: The fixed JSON plus expiry facts, content: { application/json: { schema: { $ref: "#/components/schemas/PatientView" } } } }
        "400": { description: invalid_link or invalid_language }
        "404": { description: link_not_found }
        "410": { description: link_expired or link_purged }
        "422": { description: translation_rejected }
        "423": { description: needs_review }
        "425": { description: processing }
        "502": { description: translation_failed }
